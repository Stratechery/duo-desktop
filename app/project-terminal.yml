# The Terminal view (the owner 2026-11-21: "a choice at build to incorporate either the JetKVM or the terminal or both").
# Included by project.yml only when xcodegen runs with DUO_TERMINAL=YES in its environment:
#   DUO_TERMINAL=YES xcodegen generate   → Terminal in, SwiftTerm and the SSH engine (SwiftNIO) linked
#   xcodegen generate                    → no terminal code, no SwiftTerm, no SwiftNIO
packages:
  # project notes; MIT. One exact release, as the plan says (2.0 preview line).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  # The terminal's SSH engine (swift-nio-ssh 0.15.1, Apache-2.0, pinned in its Package.swift).
  DuoTerminalKit:
    path: DuoTerminalKit
targets:
  DuoDesktop:
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: DuoTerminalKit
        product: DuoTerminalKit
    settings:
      base:
        DUO_TERMINAL_FLAG: DUO_TERMINAL
  DuoDesktopTests:
    settings:
      base:
        DUO_TERMINAL_FLAG: DUO_TERMINAL
